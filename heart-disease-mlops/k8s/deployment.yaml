apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels: {app: heart-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: heart-api:latest
          imagePullPolicy: IfNotPresent   # local image on Minikube/Docker Desktop
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
